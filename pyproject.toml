[project]
name = "cerulean-rag"
version = "0.1.0"
description = "Grounded RAG Assistant for Cerulean Systems with SQLite Observability & Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pymupdf4llm>=0.0.17",
    "chromadb>=0.4.22",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.3.0",
    "groq>=0.11.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
